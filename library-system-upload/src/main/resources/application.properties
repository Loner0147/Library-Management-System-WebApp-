# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/library
spring.data.mongodb.database=library

# JWT
app.jwt.secret=LibrarySystemSecretKey2024VeryLongAndSecureKeyForJWTSigningPurposes!
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# OAuth2 Google (update with your real credentials)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 GitHub (update with your real credentials)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=user:email

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.library=DEBUG
logging.level.org.springframework.security=DEBUG

# App
app.name=Library System
app.admin.email=admin@library.com
app.admin.password=Admin@123456
