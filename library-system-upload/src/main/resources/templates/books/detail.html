<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${book.title} + ' — LibraryHub'">Book Detail</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<nav class="navbar" th:insert="~{fragments/navbar :: navbar(activePage='books')}"></nav>

<div class="detail-container">
    <div class="detail-breadcrumb">
        <a th:href="@{/books}" class="breadcrumb-link">← Back to Books</a>
    </div>

    <div class="detail-card">
        <!-- Left: Cover -->
        <div class="detail-cover-col">
            <div class="detail-cover-wrapper">
                <img th:if="${book.coverImageUrl}" th:src="${book.coverImageUrl}"
                     class="detail-cover" alt="Book Cover"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/>
                <div class="detail-cover-placeholder" th:classappend="${book.coverImageUrl} ? 'hidden' : ''">
                    <span style="font-size:4rem"></span>
                </div>
            </div>

            <!-- Status Badge -->
            <div class="detail-status"
                 th:classappend="${book.status.name() == 'AVAILABLE'} ? 'status-available' : 'status-borrowed'">
                <span th:text="${book.status.name() == 'AVAILABLE'} ? ' Available' : ' Currently Borrowed'">Status</span>
            </div>

            <div class="detail-copies">
                <span th:text="${book.availableCopies} + ' of ' + ${book.totalCopies} + ' copies available'">copies</span>
            </div>

            <!-- Action Buttons -->
            <div class="detail-actions">
                <div th:if="${book.documentUrl}" class="action-btn-group">
                    <a th:href="${book.documentUrl}" target="_blank" class="btn btn-primary btn-full">
                         Read
                    </a>
                </div>
                <div class="action-btn-group" th:if="${!isBorrowed and book.availableCopies > 0}">
                    <button class="btn btn-secondary btn-full" th:attr="data-book-id=${book.id}" onclick="borrowBook(this.dataset.bookId)">
                        Borrow This Book
                    </button>
                </div>
                <div class="action-btn-group" th:if="${isBorrowed}">
                    <button class="btn btn-warning btn-full" th:attr="data-book-id=${book.id}" onclick="returnBook(this.dataset.bookId)">
                        Return This Book
                    </button>
                </div>
                <div th:if="${isAdmin}" class="action-btn-group admin-actions">
                    <button class="btn btn-outline btn-full"
                            th:attr="data-book-id=${book.id}" onclick="openEditBook(this.dataset.bookId)">
                        Edit Book
                    </button>
                    <button class="btn btn-danger btn-full"
                            th:attr="data-book-id=${book.id}" onclick="deleteBookAndRedirect(this.dataset.bookId)">
                        Delete Book
                    </button>
                </div>
            </div>
        </div>

        <!-- Right: Info -->
        <div class="detail-info-col">
            <div class="detail-genre-badge" th:if="${book.genre}" th:text="${book.genre}">Genre</div>
            <h1 class="detail-title" th:text="${book.title}">Book Title</h1>
            <p class="detail-author">by <strong th:text="${book.author}">Author</strong></p>

            <p class="detail-description" th:if="${book.description}" th:text="${book.description}">Description</p>

            <div class="detail-meta-grid">
                <div class="meta-item" th:if="${book.isbn}">
                    <span class="meta-label">ISBN</span>
                    <span class="meta-value" th:text="${book.isbn}">—</span>
                </div>
                <div class="meta-item" th:if="${book.publisher}">
                    <span class="meta-label">Publisher</span>
                    <span class="meta-value" th:text="${book.publisher}">—</span>
                </div>
                <div class="meta-item" th:if="${book.publicationYear}">
                    <span class="meta-label">Year</span>
                    <span class="meta-value" th:text="${book.publicationYear}">—</span>
                </div>
                <div class="meta-item" th:if="${book.language}">
                    <span class="meta-label">Language</span>
                    <span class="meta-value" th:text="${book.language}">—</span>
                </div>
                <div class="meta-item" th:if="${book.pageCount}">
                    <span class="meta-label">Pages</span>
                    <span class="meta-value" th:text="${book.pageCount}">—</span>
                </div>
                <div class="meta-item" th:if="${book.documentUrl}">
                    <span class="meta-label">Document</span>
                    <a class="meta-value meta-link" th:href="${book.documentUrl}" target="_blank">View Document ↗</a>
                </div>
            </div>

            <div class="detail-tags" th:if="${!book.tags.isEmpty()}">
                <span class="tag" th:each="tag : ${book.tags}" th:text="${tag}">tag</span>
            </div>

            <!-- Admin: Borrow History -->
            <div th:if="${isAdmin and !book.borrowHistory.isEmpty()}" class="borrow-history">
                <h3 class="section-title">Borrow History</h3>
                <div class="history-table-wrapper">
                    <table class="history-table">
                        <thead>
                        <tr>
                            <th>User</th>
                            <th>Borrowed</th>
                            <th>Returned</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="record : ${book.borrowHistory}">
                            <td th:text="${record.userName}">Name</td>
                            <td th:text="${#temporals.format(record.borrowedAt, 'dd MMM yyyy')}">Date</td>
                            <td th:text="${record.returnedAt != null} ? ${#temporals.format(record.returnedAt, 'dd MMM yyyy')} : '—'">—</td>
                            <td>
                                <span th:classappend="${record.returned} ? 'badge-returned' : 'badge-active'"
                                      class="status-badge"
                                      th:text="${record.returned} ? 'Returned' : 'Active'">Active</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/books.js}"></script>
</body>
</html>
