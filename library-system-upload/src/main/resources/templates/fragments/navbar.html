<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar(activePage)" class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/books}" class="brand-link">
            <span class="brand-icon">
                <img src="/images/school_logo.png" alt="AUI Logo" style="width: 40px; height: 40px;">
            </span>
            <span class="brand-name">AUGUSTINE UNIVERSITY LIBRARY</span>
        </a>
    </div>
    <div class="navbar-menu">
        <a th:href="@{/books}" class="nav-link" th:classappend="${activePage == 'books'} ? ' active' : ''">Browse</a>
        <a th:href="@{/profile}" class="nav-link" th:classappend="${activePage == 'profile'} ? ' active' : ''">My Library</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="nav-link admin-link"
           th:classappend="${activePage == 'admin'} ? ' active' : ''">Admin</a>
    </div>
    <div class="navbar-user">
        <div class="user-menu" id="userMenu">
            <button class="user-avatar-btn" onclick="toggleUserMenu()">
                <img th:if="${currentUser?.profileImageUrl}" th:src="${currentUser.profileImageUrl}"
                     class="avatar-img" alt="avatar"/>
                <div th:unless="${currentUser?.profileImageUrl}" class="avatar-placeholder"
                     th:text="${currentUser?.firstName?.substring(0,1)?.toUpperCase()} ?: 'U'"></div>
                <span th:text="${currentUser?.firstName} ?: 'User'" class="user-name-nav"></span>
                <span class="chevron">▾</span>
            </button>
            <div class="user-dropdown" id="userDropdown">
                <a th:href="@{/profile}" class="dropdown-item"> Profile</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="dropdown-item"> Admin Panel</a>
                <div class="dropdown-divider"></div>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="dropdown-item logout-btn"> Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
